[target.x86_64-unknown-linux-ohos]
linker = "$OHOS_NDK_HOME/llvm/bin/clang++"
rustflags = [
    "-C", "link-arg=--sysroot=$OHOS_NDK_HOME/sysroot",
    "-C", "link-arg=-L$OHOS_NDK_HOME/sysroot/usr/lib/x86_64-linux-ohos",
    "-C", "link-arg=-I$OHOS_NDK_HOME/llvm/include/c++/v1",
    # 链接C++标准库（必要时添加）
    "-C", "link-arg=-lc++",
    "-C", "link-arg=-lc++abi",
]